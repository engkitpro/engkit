<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>engkit.pro | تيشرتات اللاعبين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .sporty-font { font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: -1px; }
    .product-card:hover { transform: translateY(-12px) scale(1.03); transition: all 0.4s; }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Header -->
  <header class="bg-black border-b border-green-500/30 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="https://i.postimg.cc/htFNb359/logo4-jpg.jpg" class="w-14 h-14 rounded-2xl" alt="Engkit Logo">
        <h1 class="text-4xl font-bold sporty-font text-green-400">ENGKIT.PRO</h1>
      </div>
      
      <div class="flex items-center gap-6">
        <a href="#contact" class="hover:text-green-400 font-medium">تواصل معنا</a>
        <div onclick="toggleCart()" class="cursor-pointer relative">
          <i class="fas fa-shopping-cart text-2xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-green-500 text-black text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="h-screen flex items-center relative bg-cover bg-center" 
           style="background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://i.postimg.cc/RFdw8cWr/mlʿb.webp');">
    <div class="max-w-5xl mx-auto px-6 text-center">
      <h2 class="text-6xl md:text-7xl font-bold sporty-font leading-none mb-6">KIT UP LIKE A PRO</h2>
      <p class="text-2xl text-gray-300 mb-10">تيشرتات أصلية • نسخة اللاعبين</p>
      <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})" 
              class="bg-green-500 text-black font-bold px-12 py-5 rounded-2xl text-xl hover:bg-green-400">
        تسوق الآن ⚽
      </button>
    </div>
  </section>

  <!-- Products -->
  <section id="products" class="max-w-7xl mx-auto px-5 py-20">
    <h2 class="text-5xl font-bold text-center sporty-font mb-4">تشكيلتنا</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="products-grid"></div>
  </section>

  <!-- Product Detail Modal - محسن وأجمل -->
  <div id="product-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[90] p-4">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-lg md:max-w-4xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      
      <div class="px-6 py-5 border-b border-zinc-700 flex justify-between items-center">
        <h3 id="modal-title" class="text-xl md:text-2xl font-bold sporty-font"></h3>
        <button onclick="closeProductModal()" class="text-4xl text-gray-400 hover:text-white">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- الصورة الرئيسية -->
        <div class="bg-black rounded-2xl p-4">
          <img id="main-image" class="w-full max-h-[280px] md:max-h-[420px] object-contain mx-auto" alt="">
        </div>

        <!-- الثامبنيلز -->
        <div class="grid grid-cols-4 gap-3" id="thumbnails"></div>

        <!-- معلومات -->
        <div>
          <p id="modal-desc" class="text-gray-400 text-base md:text-lg leading-relaxed"></p>
          <p id="modal-price" class="text-3xl md:text-4xl font-bold text-green-400 mt-4"></p>
        </div>

        <!-- المقاس -->
        <div>
          <label class="block mb-2 text-sm text-gray-400">اختر المقاس</label>
          <select id="size-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <!-- الكمية -->
        <div>
          <label class="block mb-2 text-sm text-gray-400">الكمية</label>
          <input type="number" id="quantity-select" value="1" min="1" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
        </div>

        <!-- زر الإضافة -->
        <button onclick="addCurrentToCart()" 
                class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-6 rounded-2xl text-lg shadow-lg">
          أضف إلى السلة ⚡
        </button>
      </div>
    </div>
  </div>

  <!-- Cart Sidebar -->
  <div id="cart-sidebar" class="hidden fixed top-0 right-0 h-full w-full md:w-96 bg-zinc-900 shadow-2xl z-[100] overflow-y-auto">
    <div class="p-6">
      <div class="flex justify-between mb-6">
        <h3 class="text-2xl font-bold">السلة</h3>
        <button onclick="toggleCart()" class="text-3xl">✕</button>
      </div>
      <div id="cart-items" class="space-y-6"></div>
      
      <div class="mt-8 pt-6 border-t border-zinc-700">
        <div class="flex justify-between text-xl mb-6">
          <span>المجموع:</span>
          <span id="cart-total" class="font-bold text-green-400">0 دينار</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-5 rounded-2xl">تأكيد الطلب</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[110] p-4">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-md max-h-[88vh] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b flex justify-between items-center">
        <h3 class="text-2xl font-bold">إكمال الطلب</h3>
        <button onclick="closeCheckout()" class="text-4xl text-gray-400">✕</button>
      </div>
      
      <div class="flex-1 overflow-y-auto p-6">
        <form id="checkout-form" onsubmit="submitOrder(event)">
          <div class="space-y-5">
            <div>
              <label class="block mb-2 text-gray-400">الاسم الكامل</label>
              <input type="text" id="name" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4">
            </div>
            <div>
              <label class="block mb-2 text-gray-400">رقم الواتساب</label>
              <input type="tel" id="phone" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4">
            </div>
            <div>
              <label class="block mb-2 text-gray-400">عنوان التوصيل</label>
              <textarea id="address" rows="4" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4"></textarea>
            </div>
            <div>
              <label class="block mb-2 text-gray-400">طريقة الدفع</label>
              <div class="space-y-3">
                <label class="flex items-center gap-3 bg-zinc-800 p-4 rounded-2xl cursor-pointer">
                  <input type="radio" name="payment" value="cash" checked> دفع عند الاستلام
                </label>
                <label class="flex items-center gap-3 bg-zinc-800 p-4 rounded-2xl cursor-pointer">
                  <input type="radio" name="payment" value="online"> دفع إلكتروني
                </label>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="p-6 border-t border-zinc-700 flex gap-4">
        <button type="button" onclick="closeCheckout()" class="flex-1 py-4 border border-zinc-700 rounded-2xl">إلغاء</button>
        <button type="button" onclick="document.getElementById('checkout-form').dispatchEvent(new Event('submit'))" 
                class="flex-1 bg-green-500 text-black font-bold py-4 rounded-2xl">إرسال الطلب</button>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[120]">
    <div class="bg-zinc-900 p-10 rounded-3xl text-center max-w-md">
      <i class="fas fa-check-circle text-7xl text-green-500 mb-6"></i>
      <h3 class="text-3xl font-bold mb-4">تم استلام طلبك بنجاح!</h3>
      <p class="text-gray-400">سنتواصل معك قريباً.</p>
      <button onclick="location.reload()" class="mt-8 bg-green-500 text-black px-10 py-4 rounded-2xl">موافق</button>
    </div>
  </div>

  <!-- Contact -->
  <section id="contact" class="bg-black py-20 border-t border-green-500/30">
    <div class="max-w-4xl mx-auto px-5 text-center">
      <h2 class="text-5xl font-bold sporty-font mb-4 neon-green">تواصل معنا</h2>
      <div class="grid md:grid-cols-2 gap-10 mt-12">
        <div class="bg-zinc-900 rounded-3xl p-10">
          <i class="fas fa-phone-volume text-5xl text-green-500 mb-6"></i>
          <h3 class="text-2xl font-bold mb-3">اتصل بنا</h3>
          <a href="tel:0776877198" class="text-3xl font-bold text-green-400">0776877198</a>
        </div>
        <div class="bg-zinc-900 rounded-3xl p-10">
          <i class="fab fa-instagram text-5xl text-pink-500 mb-6"></i>
          <h3 class="text-2xl font-bold mb-3">إنستغرام</h3>
          <a href="https://www.instagram.com/engkit.pro" target="_blank" class="text-3xl font-bold text-pink-400">@Engkit.pro</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    let cart = [];
    let currentProduct = null;
    let currentImages = [];
    let currentImageIndex = 0;

    const FORMSPREE_URL = "https://formspree.io/f/xnjrzzlo";

    const products = [ /* نفس المنتجات اللي عندك */ 
      { id:1, name: "تيشرت اسبانيا الاحتياطي 2026", price: 16, desc: "نسخة لاعبين", images: ["https://i.postimg.cc/cCLdW5SL/spania.jpg","https://i.postimg.cc/0y3sxD1b/spain2.jpg","https://i.postimg.cc/x8gwZbPS/spain3.jpg"] },
      { id:2, name: "تيشرت الارجنتين الاحتياطي 2026", price: 16, desc: "نسخة لاعبين", images: ["https://i.postimg.cc/VL5zHT4Y/argantin.jpg","https://i.postimg.cc/L8ZHJNT3/argentina2.jpg","https://i.postimg.cc/SRs4krRr/argentina3.jpg"] },
      { id:3, name: "تيشرت البرتغال الاساسي 2026", price: 16, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/7LrDhL4T/bortogal.jpg","https://i.postimg.cc/XqCRj7dr/portugal2.jpg","https://i.postimg.cc/sD3mDgYV/portugal3.jpg"] },
      { id:4, name: "تيشرت المانيا الاساسي 2026", price: 16, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/XJQ0scCn/germanny.jpg","https://i.postimg.cc/d1tQVdVV/germany2.jpg", "https://i.postimg.cc/6Q6TyFHf/germany3.jpg"] },
      { id:5, name: "تيشرت فرنسا الاساسي 2026", price: 16, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/ZYsS3Hmw/faranca.jpg","https://i.postimg.cc/L8ZHJNT3/argentina2.jpg","https://i.postimg.cc/SRs4krRr/argentina3.jpg"] },
      { id:6, name: "تيشرت برشلونة الذكرى 125", price: 13, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/YCPqCjmP/barca.jpg","https://i.postimg.cc/vT2CtxyC/barca4.jpg","https://i.postimg.cc/W4mKfHjM/barca3.jpg","https://i.postimg.cc/Tw7tz8sb/barca2.jpg"] },
      { id:7, name: "تيشرت الملكية ريال مدريد 25/26", price: 13, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/yNrf54t0/madrid.jpg","https://i.postimg.cc/jSxZSSr2/madrid2.jpg","https://i.postimg.cc/057fGwkY/madrid4.jpg","https://i.postimg.cc/52Kq953r/madrid3.jpg"] },
      { id:8, name: "تيشرت برشلونة النسخة 25/26", price: 13, desc: ["نسخة اللاعبين","نسخة خاصة"], images: ["https://i.postimg.cc/L6bnnxcP/barcaa.jpg","https://i.postimg.cc/pTRdg4jR/barcaa-2.jpg","https://i.postimg.cc/XY57X4c4/barcaa-3.jpg","https://i.postimg.cc/VkXmm4mP/barcaa-4.jpg"] },
      { id:9, name: "تيشرت برشلونة الاساسي لموسم 25/26", price: 13, desc: "نسخة اللاعبين", images: ["https://i.postimg.cc/fRyqvRgZ/bbarcaa.jpg","https://i.postimg.cc/d0TWzSFY/bbarcaa-1.jpg","https://i.postimg.cc/prPq5Wng/bbarcaa-2.jpg","https://i.postimg.cc/hPP2SGnb/bbarcaa-3.jpg"] }
    ];


    const grid = document.getElementById('products-grid');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = "product-card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden cursor-pointer";
      card.innerHTML = `
        <img src="${p.images[0]}" class="w-full h-72 object-cover">
        <div class="p-5">
          <h3 class="font-bold text-lg">${p.name}</h3>
          <p class="text-green-400 text-2xl font-semibold mt-2">${p.price} دينار</p>
        </div>
      `;
      card.onclick = () => showProductModal(p);
      grid.appendChild(card);
    });

    function showProductModal(product) {
      currentProduct = product;
      currentImages = product.images;
      currentImageIndex = 0;

      document.getElementById('modal-title').textContent = product.name;
      document.getElementById('modal-desc').textContent = product.desc;
      document.getElementById('modal-price').textContent = product.price + " دينار";
      
      updateMainImage();

      const thumbs = document.getElementById('thumbnails');
      thumbs.innerHTML = '';
      currentImages.forEach((src, index) => {
        const thumb = document.createElement('img');
        thumb.src = src;
        thumb.className = `w-full aspect-square object-cover rounded-2xl cursor-pointer border-2 transition-all ${index === 0 ? 'border-green-500' : 'border-transparent'}`;
        thumb.onclick = () => {
          currentImageIndex = index;
          updateMainImage();
        };
        thumbs.appendChild(thumb);
      });

      document.getElementById('product-modal').classList.remove('hidden');
    }

    function updateMainImage() {
      document.getElementById('main-image').src = currentImages[currentImageIndex];
      document.querySelectorAll('#thumbnails img').forEach((t, i) => t.classList.toggle('border-green-500', i === currentImageIndex));
    }

    function nextImage() { currentImageIndex = (currentImageIndex + 1) % currentImages.length; updateMainImage(); }
    function prevImage() { currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length; updateMainImage(); }

    function closeProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    function addCurrentToCart() {
      if (!currentProduct) return;
      const size = document.getElementById('size-select').value;
      const quantity = parseInt(document.getElementById('quantity-select').value) || 1;

      cart.push({ ...currentProduct, size, quantity });
      updateCartCount();
      alert(`${currentProduct.name} - مقاس ${size} (${quantity} قطع) ✅`);
    }

    function updateCartCount() {
      const count = cart.reduce((a, b) => a + b.quantity, 0);
      document.getElementById('cart-count').textContent = count;
    }

    function toggleCart() {
      const sidebar = document.getElementById('cart-sidebar');
      const itemsDiv = document.getElementById('cart-items');
      itemsDiv.innerHTML = '';

      if (cart.length === 0) {
        itemsDiv.innerHTML = `<p class="text-center text-gray-400 py-12">السلة فارغة</p>`;
      } else {
        cart.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = "flex gap-4 bg-zinc-800 p-4 rounded-2xl";
          div.innerHTML = `
            <img src="${item.images[0]}" class="w-20 h-20 object-cover rounded-xl">
            <div class="flex-1">
              <h4 class="font-medium">${item.name}</h4>
              <p class="text-green-400">${item.price} دينار × ${item.quantity} • مقاس ${item.size}</p>
              <button onclick="removeFromCart(${index})" class="text-red-500 text-sm mt-2">حذف</button>
            </div>
          `;
          itemsDiv.appendChild(div);
        });
      }
      document.getElementById('cart-total').textContent = cart.reduce((sum, item) => sum + item.price * item.quantity, 0) + " دينار";
      sidebar.classList.toggle('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      toggleCart();
      updateCartCount();
    }

    function openCheckout() {
      if (cart.length === 0) return alert("السلة فارغة");
      document.getElementById('cart-sidebar').classList.add('hidden');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function submitOrder(e) {
      e.preventDefault();
      closeCheckout();
      document.getElementById('success-modal').classList.remove('hidden');
      cart = [];
      updateCartCount();
    }
  </script>
</body>
</html>
